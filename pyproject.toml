[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastmcp-http-starter"
version = "0.1.0"
description = "An extensible FastMCP server using Streamable HTTP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastmcp==4.0.5", "uvicorn==0.53.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
